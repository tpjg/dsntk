[package]
name = "dsntk-common"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | Common definitions"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "commons"]
documentation = "https://docs.rs/dsntk-common"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
uriparse = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
dsntk-macros = { workspace = true }

# `Uuid::new_v4` needs a source of randomness, and on `wasm32-unknown-unknown`
# there is no OS to ask.
#
# A consumer targeting WASI rather than the browser wants `rng-getrandom`
# instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
